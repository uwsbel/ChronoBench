# Conda environment for ChronoBench (preferred install path on a conda machine).
#   conda env create -f environment.yml
#   conda activate chronobench
# Most packages come from conda-forge; only the tree-sitter/codebleu stack and the
# Google/Mistral SDKs (not reliably on conda-forge) are installed via pip.
# After a successful build, `conda env export --no-builds > environment.lock.yml`
# captures exact versions for full reproducibility.
#
# NOTE: this does NOT install PyChrono. Compiling/running generated digital twins
# (the Compile@1 / execution checks) needs a separate PyChrono install; the J-LLM
# evaluation itself (chronobench.judge / chronobench.score) does not.
name: chronobench
channels:
  - conda-forge
dependencies:
  - python=3.11
  # data / numerics
  - pandas>=2.0,<3.0
  - numpy>=1.24,<2.0
  - scipy>=1.10
  - scikit-learn>=1.3
  - statsmodels>=0.14
  - tiktoken>=0.5
  # visualization
  - matplotlib>=3.7
  - seaborn>=0.12
  # api clients available on conda-forge
  - openai>=1.0,<2.0
  - anthropic>=0.34,<1.0
  # metrics / utils
  - evaluate>=0.4.0
  - rouge-score>=0.1.2
  - absl-py>=2.0
  - tqdm>=4.60
  - pip
  - pip:
      # tree-sitter ABI must match codebleu; keep these versions in lockstep.
      - codebleu==0.7.0
      - tree-sitter>=0.22.0,<0.23.0
      - tree-sitter-python==0.21.0
      # provider SDKs not reliably packaged on conda-forge
      - google-generativeai>=0.7,<1.0
      - mistralai>=1.0,<2.0
